# Coral installation — water temperature sensor
# ESP32-C3 Mini + waterproof DS18B20 on GPIO4 (4.7k pull-up to 3V3)
#
# First flash over USB:  esphome run esphome/coral-temp-sensor.yaml
# Subsequent updates are over-the-air.
# Verify: curl http://<sensor-ip>/sensor/water_temperature

esphome:
  name: coral-temp-sensor
  friendly_name: Coral Water Temperature

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:

# Local web server — the orchestration server polls this.
# No cloud, no Home Assistant required.
web_server:
  port: 80
  version: 2

wifi:
  ssid: !secret wifi_ssid          # the 2.4 GHz SSID
  password: !secret wifi_password
  # Fallback AP if the network is unavailable
  ap:
    ssid: "coral-temp-fallback"
    password: !secret fallback_password

captive_portal:

# Optional: uncomment to publish over MQTT instead of HTTP polling
# mqtt:
#   broker: 192.168.50.10
#   topic_prefix: coral

# 1-Wire bus. The old single `dallas:` component was replaced by a `one_wire`
# bus plus a `dallas_temp` sensor platform; update_interval and address now
# live on the sensor, not on the bus.
one_wire:
  - platform: gpio
    pin: GPIO4

sensor:
  - platform: dallas_temp
    # Run once with this commented out; the log prints the probe's address.
    # Then set it here so the sensor is identified explicitly.
    # address: 0x1234567890abcdef
    index: 0
    id: water_temperature
    # The web server's REST path is built from this *name*, not from `id`, so a
    # space here becomes %20 in the URL the orchestration server polls. Keeping
    # the name URL-safe keeps `temperature.real.sensor_url` free of escaping.
    name: "water_temperature"
    # 12-bit is 0.0625 °C steps, but its conversion takes up to 750 ms, so the
    # interval cannot be faster than that. 1 s is ample: the water's thermal
    # mass takes 60–90 s to cross the 2 °C the whole state machine spans.
    update_interval: 1s
    resolution: 12
    unit_of_measurement: "°C"
    accuracy_decimals: 2
    filters:
      # Light smoothing — the state machine wants a stable reading,
      # not raw sensor jitter. Sliding median: a value every second,
      # ~2 s of lag, one bad sample outvoted.
      - median:
          window_size: 3
          send_every: 1

  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

binary_sensor:
  - platform: status
    name: "Sensor Status"
